name: Build Native APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode fixed keystore
        run: |
          mkdir -p keystore
          if [ -f keystore/ascan-native.keystore.b64 ]; then
            base64 -d keystore/ascan-native.keystore.b64 > keystore/ascan-native.keystore
            ls -la keystore/
          else
            echo "WARN: keystore b64 missing"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AScan-Agent-Native-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: AScan Agent Native Build ${{ github.run_number }}
          files: android-native/app/build/outputs/apk/debug/*.apk
          body: |
            ## AScan Agent Native 2.0.5
            Hits mesmo arquivo, proxy 2000, direto primeiro, assinatura fixa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
