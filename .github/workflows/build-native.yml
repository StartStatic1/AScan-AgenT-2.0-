name: Build Native APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AScan-Agent-Native-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: AScan Agent Native Build ${{ github.run_number }}
          files: android-native/app/build/outputs/apk/debug/*.apk
          body: |
            ## AScan Agent Native (Kotlin)
            UI Compose + multi-servidor + combo GitHub + proxy + PLAYER
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
